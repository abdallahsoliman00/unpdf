[workspace]
members = [".", "cli", "unpdf-wasm"]
resolver = "2"

[package]
name = "unpdf"
version = "0.17.0"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "High-performance PDF content extraction to Markdown, text, and JSON"
repository = "https://github.com/iyulab/unpdf"
homepage = "https://github.com/iyulab/unpdf"
documentation = "https://docs.rs/unpdf"
readme = "README.md"
keywords = ["pdf", "markdown", "text-extraction", "document", "parser"]
categories = ["parser-implementations", "text-processing"]
rust-version = "1.87"

[lib]
name = "unpdf"
crate-type = ["lib", "cdylib"]

[features]
default = ["fast-parse", "refine", "ai"]
ffi = []
async = ["tokio"]
fast-parse = []  # Enable nom_parser for faster PDF parsing
# Shape-refinement pass (RenderOptions.refine). Pulls in unrefine, and with
# it pulldown-cmark + pulldown-cmark-to-cmark (unpdf has no other use for a
# CommonMark parser). On by default for native/CLI/FFI builds; unpdf-wasm
# excludes it (see its Cargo.toml) to keep the wasm bundle delta negligible.
refine = ["dep:unrefine"]
# VLM image understanding + AI refine (ParseOptions.ai / RenderOptions.ai_refine).
# Native-only — unparser-shared's `ai` feature depends on `ureq`, which does not
# support wasm32-unknown-unknown. unpdf-wasm never enables this feature.
ai = ["dep:unparser-shared"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Shared error-kind numbering + C-ABI plumbing for the un* family
uncore = "0.2"

# Compression
flate2 = "1.1"
crc32fast = "1.5"  # PNG chunk CRCs when re-encoding FlateDecode images

# PDF decryption
rc4 = "0.2"
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"

# Text processing
regex = "1.11"
unicode-bidi = "0.3"
unicode-normalization = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Logging
log = "0.4"

# Optional: Async I/O
tokio = { version = "1.42", features = ["rt", "fs"], optional = true }

# Lossless, idempotent markdown shape-refinement pass (RenderOptions.refine)
unrefine = { version = "0.1", optional = true }

# VLM image understanding + AI refine (feature "ai"). Transitional third shared
# dependency alongside uncore/unrefine: unparser-shared supersedes both, and a
# later breaking release collapses all three into it.
unparser-shared = { version = "0.2", default-features = false, features = ["ai"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"
crossbeam-channel = "0.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"
peak_alloc = "0.3"
serde_json = "1.0"  # FFI introspection 테스트의 JSON 결과 검증용
png = "0.17"  # round-trip verification for the FlateDecode-image PNG re-encoder
tiny_http = "0.12"  # minimal mock HTTP server for the "ai" feature's integration tests

[[bench]]
name = "parse_benchmark"
harness = false

[[test]]
name = "ai_wiring_test"
path = "tests/ai_wiring_test.rs"
required-features = ["ai"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
